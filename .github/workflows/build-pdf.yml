name: build pdf

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build pdf and upload release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - name: build pdf
        run: |
          npm run build:pdf
          mv docs/README.pdf resume.pdf
          mv docs/fulltime.pdf resume-fulltime.pdf
      - name: create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            resume.pdf
            resume-fulltime.pdf
